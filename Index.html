<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #0a0a0f;
    background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0a0a0f 60%);
    color: #e2e8f0;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
}

#chat-container {
    width: 100%;
    max-width: 900px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* Header */
header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(10px);
    z-index: 10;
}
header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 1px;
}
header p {
    font-size: 11px;
    color: #64748b;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
}

/* Chat Area */
#chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
}

.message {
    max-width: 85%;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    color: #fff;
    padding: 14px 20px;
    border-radius: 20px 20px 4px 20px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
}

.message.ai {
    align-self: flex-start;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 16px 20px;
    border-radius: 20px 20px 20px 4px;
}

.message.ai code {
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #38bdf8;
}

.message.ai pre {
    background: #0f172a;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 10px 0;
    border: 1px solid rgba(255,255,255,0.1);
}
.message.ai pre code {
    background: transparent;
    padding: 0;
    color: #e2e8f0;
}

/* Input Area */
#input-area {
    padding: 20px;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.input-wrapper {
    display: flex;
    gap: 12px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 10px 10px 10px 20px;
    transition: border-color 0.2s;
}
.input-wrapper:focus-within {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
}

#user-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: none;
    outline: none;
    padding: 10px 0;
    max-height: 150px;
}
#user-input::placeholder { color: #64748b; }

#send-btn {
    background: #7c3aed;
    border: none;
    border-radius: 12px;
    color: #fff;
    width: 44px;
    height: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
}
#send-btn:hover { background: #6d28d9; transform: scale(1.05); }
#send-btn:active { transform: scale(0.95); }
#send-btn:disabled { background: #334155; cursor: not-allowed; transform: none; }

/* Loading Dots */
.typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 20px;
}
.typing span {
    width: 6px;
    height: 6px;
    background: #a78bfa;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body>

<div id="chat-container">
    <header>
        <h1>NEXUS AI</h1>
        <p>model: openai/gpt-oss-120b</p>
    </header>

    <div id="chat-log">
        <!-- Initial AI Message -->
        <div class="message ai">
            Ready. What are we building or exploring today?
        </div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Message Nexus..."></textarea>
            <button id="send-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<script>
const API_KEY = "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "openai/gpt-oss-120b";

const chatLog = document.getElementById('chat-log');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

let messages = [
    { role: "system", content: "You are Nexus, a highly capable AI assistant. Be direct, helpful, and conversational. Skip the filler and get straight to the point." }
];

// Auto-resize textarea
userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});

// Enter to send (Shift+Enter for new line)
userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener('click', sendMessage);

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Reset input
    userInput.value = '';
    userInput.style.height = 'auto';
    
    // Add user message to UI and history
    addMessage(text, 'user');
    messages.push({ role: "user", content: text });

    // Disable UI
    sendBtn.disabled = true;
    userInput.disabled = true;

    // Add typing indicator
    const typingId = 'typing-' + Date.now();
    const typingHTML = `
        <div class="typing" id="${typingId}">
            <span></span><span></span><span></span>
        </div>
    `;
    const botMsgDiv = addMessage(typingHTML, 'ai', true);

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${API_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages,
                temperature: 0.7,
                max_tokens: 4096,
                stream: true
            })
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || "API Error");
        }

        // Handle Streaming
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let aiResponse = "";
        let isFirstChunk = true;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n').filter(line => line.trim() !== '');

            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    
                    try {
                        const parsed = JSON.parse(data);
                        const content = parsed.choices[0]?.delta?.content || "";
                        if (content) {
                            if (isFirstChunk) {
                                botMsgDiv.innerHTML = '';
                                isFirstChunk = false;
                            }
                            aiResponse += content;
                            // Simple formatting: replace markdown code blocks and newlines
                            botMsgDiv.innerHTML = formatMarkdown(aiResponse);
                            chatLog.scrollTop = chatLog.scrollHeight;
                        }
                    } catch (e) { /* ignore incomplete JSON chunks */ }
                }
            }
        }

        // Save final response to history
        messages.push({ role: "assistant", content: aiResponse });

    } catch (error) {
        botMsgDiv.innerHTML = `<span style="color: #ef4444;">⚠️ Error: ${error.message}</span>`;
    } finally {
        // Re-enable UI
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
    }
}

function addMessage(html, type, isRaw = false) {
    const div = document.createElement('div');
    div.className = `message ${type}`;
    if (isRaw) {
        div.innerHTML = html;
    } else {
        div.textContent = html;
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
}

// Very basic markdown parser for bold, inline code, and code blocks
function formatMarkdown(text) {
    // Escape HTML to prevent XSS
    let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    
    // Code blocks
    html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
        return `<pre><code>${code.trim()}</code></pre>`;
    });
    
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    
    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    
    return html;
}
</script>

</body>
</html>
