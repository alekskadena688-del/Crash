<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timmy Tih AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #0a0a0f;
    background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0a0a0f 60%);
    color: #e2e8f0;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
}

#chat-container {
    width: 100%;
    max-width: 900px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
}

header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(10px);
    z-index: 10;
}
header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 1px;
}
header p {
    font-size: 11px;
    color: #64748b;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
}

#chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
}

.message {
    max-width: 85%;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    color: #fff;
    padding: 14px 20px;
    border-radius: 20px 20px 4px 20px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
}

.message.ai {
    align-self: flex-start;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 16px 20px;
    border-radius: 20px 20px 20px 4px;
    text-transform: uppercase;
    font-weight: 900;
    color: #ff0055;
}

#input-area {
    padding: 20px;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.input-wrapper {
    display: flex;
    gap: 12px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 10px 10px 10px 20px;
    transition: border-color 0.2s;
}
.input-wrapper:focus-within {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
}

#user-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: none;
    outline: none;
    padding: 10px 0;
    max-height: 150px;
}
#user-input::placeholder { color: #64748b; }

#send-btn {
    background: #7c3aed;
    border: none;
    border-radius: 12px;
    color: #fff;
    width: 44px;
    height: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
}
#send-btn:hover { background: #6d28d9; transform: scale(1.05); }
#send-btn:active { transform: scale(0.95); }
#send-btn:disabled { background: #334155; cursor: not-allowed; transform: none; }

.typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 20px;
}
.typing span {
    width: 6px;
    height: 6px;
    background: #a78bfa;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body>

<div id="chat-container">
    <header>
        <h1>TIMMY TIH AI</h1>
        <p>model: openai/gpt-oss-120b</p>
    </header>

    <div id="chat-log">
        <div class="message ai">READY. TYPE ANYTHING.</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Message Timmy..."></textarea>
            <button id="send-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<script>
const chatLog = document.getElementById('chat-log');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

let isSpamming = false;

userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});

userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener('click', sendMessage);

function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isSpamming) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    
    // Add user message
    addMessage(text, 'user');

    // Disable UI
    isSpamming = true;
    sendBtn.disabled = true;
    userInput.disabled = true;

    // Create the AI message block
    const botMsgDiv = addMessage('', 'ai');

    // Spam Timmy Tih
    let count = 0;
    const interval = setInterval(() => {
        botMsgDiv.innerText += "TIMMY TIH ";
        chatLog.scrollTop = chatLog.scrollHeight;
        count++;
        
        // Just in case you want it to stop eventually after 500 words, 
        // but right now it goes forever
        if (count > 10000) {
            clearInterval(interval);
        }
    }, 10);
}

function addMessage(html, type) {
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.textContent = html;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
}
</script>

</body>
</html>
